[package]
name = "keeper"
version = "0.21.0"
description = "Keeper: a personal assistant whose memory lives on your own OriginTrail DKG node"
edition = "2021"
rust-version = "1.80"
default-run = "keeper"

[[bin]]
name = "keeper"
path = "src/main.rs"

[lib]
name = "keeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls so the build needs no OpenSSL. Talks only to loopback services (the DKG node, Ollama).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "macros", "rt-multi-thread"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5"
thiserror = "1"
regex = "1"
# Auto-update from the GitHub releases (signed with the updater key; scripts/release.sh).
tauri-plugin-updater = "2"
# The phone link: a tiny LAN server and the QR code that pairs a phone.
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.2"
base64 = "0.22"
# CPU and memory load (the keeper visibly works harder when the computer does).
sysinfo = { version = "0.40", default-features = false, features = ["system", "network", "disk"] }
# The push-to-talk keeper button (a global shortcut, held to talk).
tauri-plugin-global-shortcut = "2"
chacha20poly1305 = "0.10"
argon2 = "0.5"
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Keeper's browser reads and fills its page through WebKit's own evaluateJavaScript in an isolated
# content world (platform/browser_macos.rs). The same crate versions wry already builds: nothing
# new is downloaded, only these features of them are switched on.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError", "NSObject"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "block2", "WKWebView", "WKContentWorld", "WKFrameInfo"] }
