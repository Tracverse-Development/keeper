<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Keeper</title>
<style>
  :root { --navy: #0b1020; --navy2: #151c33; --gold: #d39744; --gold2: #f0c98a; --cream: #f4eee2; --muted: #9aa3bf; --line: rgba(244,238,226,.1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(120% 80% at 50% 0%, #1e2848, var(--navy) 60%); color: var(--cream);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 12px; padding: 18px 18px 10px; }
  .orb { width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff8ea, #d9cfbd 45%, #8d8572);
    box-shadow: 0 0 24px rgba(211,151,68,.45), inset 0 -4px 10px rgba(0,0,0,.25); position: relative; transition: transform .3s; }
  .orb::after { content: ''; position: absolute; inset: 12px 8px 14px; border-radius: 10px; background: #151c33;
    box-shadow: inset 0 0 0 1.5px var(--gold); }
  .orb.busy { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); box-shadow: 0 0 34px rgba(211,151,68,.7); } }
  h1 { margin: 0; font: 500 20px Georgia, "New York", serif; }
  .sub { font-size: 12px; color: var(--muted); }
  main { flex: 1; overflow-y: auto; padding: 8px 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .b { max-width: 85%; padding: 10px 14px; border-radius: 18px; animation: up .35s ease both; white-space: pre-wrap; word-wrap: break-word; }
  .you { align-self: flex-end; background: linear-gradient(180deg, rgba(211,151,68,.3), rgba(181,123,44,.22)); border: 1px solid rgba(240,201,138,.3); border-bottom-right-radius: 6px; }
  .them { align-self: flex-start; background: rgba(21,28,51,.9); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .note { font-size: 12px; color: var(--gold2); margin-top: 6px; }
  .err { color: #e2786a; align-self: center; font-size: 14px; text-align: center; }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } }
  form { display: flex; gap: 8px; padding: 10px 12px 14px; }
  input { flex: 1; height: 48px; border-radius: 24px; border: 1px solid var(--line); background: rgba(7,10,22,.7); color: var(--cream); padding: 0 18px; font-size: 16px; outline: none; }
  input:focus { border-color: rgba(211,151,68,.5); }
  button { height: 48px; padding: 0 20px; border: 0; border-radius: 24px; font-weight: 600; font-size: 15px; color: #070a16;
    background: linear-gradient(180deg, #e3b06a, #b57b2c); }
  button:disabled { opacity: .5; }
  .plan { display: flex; gap: 8px; margin-top: 10px; }
  .plan button { height: 38px; padding: 0 16px; font-size: 14px; }
  .plan button.no { background: transparent; color: var(--cream); border: 1px solid var(--line); }
  ol.steps { margin: 8px 0 0 18px; padding: 0; font-size: 14px; }
  label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-left: auto; }
  /* Panels: what the keeper shows with an answer, drawn as plain text (never parsed as HTML). */
  .panel { align-self: stretch; padding: 12px 14px; border-radius: 16px; background: rgba(21,28,51,.75); border: 1px solid var(--line); animation: up .35s ease both; }
  .panel .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
  .panel h2 { margin: 2px 0 8px; font: 500 17px Georgia, "New York", serif; }
  .panel p { margin: 0 0 6px; }
  .panel ul, .panel ol { margin: 4px 0 0 18px; padding: 0; }
  .panel li { margin: 3px 0; }
  .panel .muted { color: var(--muted); font-size: 13px; }
  .panel table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .panel th, .panel td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .panel th { color: var(--gold2); font-weight: 600; }
  .panel .scroll { overflow-x: auto; }
  .panel a.go { display: inline-block; margin-top: 6px; padding: 8px 14px; border-radius: 18px; background: linear-gradient(180deg, #e3b06a, #b57b2c); color: #070a16; font-weight: 600; text-decoration: none; }
  .panel a { color: var(--gold2); }
  .panel .choice { display: block; width: 100%; margin: 6px 0 0; height: auto; padding: 10px 14px; text-align: left; background: rgba(7,10,22,.7); color: var(--cream); border: 1px solid var(--line); font-weight: 500; }
  .panel .choice.right { border-color: #6fd39a; } .panel .choice.wrong { border-color: #e2786a; }
</style>
</head>
<body>
<header>
  <div class="orb" id="orb"></div>
  <div><h1 id="name">Keeper</h1><div class="sub">Memory on your own DKG node</div></div>
  <label><input type="checkbox" id="speak" checked style="height:auto;width:auto"> Read aloud</label>
</header>
<main id="feed"></main>
<form id="form"><input id="text" placeholder="Talk to your assistant…" autocomplete="off" enterkeyhint="send"><button id="send">Send</button></form>
<script>
  // The token arrives in the URL fragment (#t=…): browsers never send a fragment in a request.
  const token = new URLSearchParams(location.hash.slice(1)).get('t') || '';
  const feed = document.getElementById('feed'), form = document.getElementById('form'), text = document.getElementById('text');
  const send = document.getElementById('send'), orb = document.getElementById('orb');
  const api = (path, body) => fetch(path, { method: body ? 'POST' : 'GET', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
    .then(async (r) => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Something went wrong.'); return j; });
  // Text only (textContent): nothing the assistant says is ever parsed as HTML.
  function bubble(cls, words, note) {
    const el = document.createElement('div'); el.className = 'b ' + cls; el.textContent = words;
    if (note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = note; el.appendChild(n); }
    feed.appendChild(el); feed.scrollTop = feed.scrollHeight;
    return el;
  }
  function say(words) {
    if (!document.getElementById('speak').checked || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(words));
  }
  api('/api/hello').then((h) => { document.getElementById('name').textContent = h.name; bubble('them', 'Hello, I’m ' + h.name + '. What can I do for you?'); })
    .catch((e) => bubble('err', e.message));
  // A plan to approve: its steps, then Approve / Don't (the keeper acts only after Approve).
  function planButtons(el, plan) {
    const list = document.createElement('ol'); list.className = 'steps';
    for (const s of plan.steps) { const li = document.createElement('li'); li.textContent = s.action + ' ' + s.target; list.appendChild(li); }
    const row = document.createElement('div'); row.className = 'plan';
    const yes = document.createElement('button'); yes.textContent = 'Approve and do it';
    const no = document.createElement('button'); no.textContent = 'Don\u2019t'; no.className = 'no';
    const decide = async (approve) => {
      yes.disabled = no.disabled = true; orb.classList.add('busy');
      try { show(await api('/api/plan', { token: plan.token, approve })); }
      catch (e) { bubble('err', e.message); }
      finally { orb.classList.remove('busy'); }
    };
    yes.onclick = () => decide(true); no.onclick = () => decide(false);
    row.append(yes, no); el.append(list, row);
  }
  // A panel the keeper showed, as a card on the phone. Every word is set with textContent; a link
  // is only ever http(s). Kinds the phone cannot draw well say they are on the Mac.
  const KINDS = { text: 'Notes', table: 'Table', steps: 'Steps', cards: 'Cards', quiz: 'Quiz', chart: 'Numbers', timeline: 'Timeline', flashcards: 'Flashcards', agenda: 'Agenda', checklist: 'Checklist', facts: 'What I know', sources: 'Sources', media: 'Watch', web: 'Web' };
  const el = (tag, cls, words) => { const e = document.createElement(tag); if (cls) e.className = cls; if (words != null) e.textContent = words; return e; };
  const safeUrl = (u) => (typeof u === 'string' && /^https?:\/\//i.test(u) ? u : null);
  const list = (tag, items, line) => { const l = el(tag); for (const it of items || []) l.appendChild(el('li', null, line(it))); return l; };
  function link(href, words, cls) { const url = safeUrl(href); if (!url) return el('span', 'muted', words); const a = el('a', cls, words); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; return a; }
  function panelCard(p) {
    const card = el('section', 'panel');
    card.append(el('div', 'k', KINDS[p.kind] || 'On your Mac'), el('h2', null, p.title || ''));
    switch (p.kind) {
      case 'text': card.appendChild(el('p', null, p.body)); if (p.bullets) card.appendChild(list('ul', p.bullets, (b) => b)); break;
      case 'table': {
        const wrap = el('div', 'scroll'), t = el('table'), head = el('tr');
        for (const c of p.columns || []) head.appendChild(el('th', null, c));
        t.appendChild(head);
        for (const r of p.rows || []) { const tr = el('tr'); for (const c of r) tr.appendChild(el('td', null, c)); t.appendChild(tr); }
        wrap.appendChild(t); card.appendChild(wrap); if (p.caption) card.appendChild(el('p', 'muted', p.caption)); break;
      }
      case 'steps': card.appendChild(list('ol', p.steps, (s) => s.label + (s.detail ? ': ' + s.detail : ''))); break;
      case 'cards': card.appendChild(list('ul', p.cards, (c) => (c.emoji ? c.emoji + ' ' : '') + c.title + ': ' + c.body)); break;
      case 'chart': card.appendChild(list('ul', (p.labels || []).map((l, i) => [l, p.values[i]]), ([l, v]) => l + ': ' + v + (p.unit ? ' ' + p.unit : ''))); break;
      case 'timeline': card.appendChild(list('ul', p.events, (e) => e.when + ': ' + e.title + (e.detail ? ' (' + e.detail + ')' : ''))); break;
      case 'agenda': card.appendChild(list('ul', p.items, (i) => (i.time ? i.time + ' · ' : '') + i.title + (i.detail ? ' (' + i.detail + ')' : ''))); break;
      case 'checklist': card.appendChild(list('ul', p.items, (i) => (i.done ? '☑ ' : '☐ ') + i.text)); break;
      case 'facts': card.appendChild(list('ul', p.facts, (f) => f.text)); break;
      case 'sources': { const l = el('ul'); for (const i of p.items || []) { const li = el('li'); li.appendChild(link(i.url, i.title)); if (i.note) li.appendChild(el('div', 'muted', i.note)); l.appendChild(li); } card.appendChild(l); break; }
      case 'web': if (p.summary) card.appendChild(el('p', null, p.summary)); card.appendChild(link(p.url, 'Open the page', 'go')); break;
      case 'media':
        if (p.channel || p.length) card.appendChild(el('p', 'muted', [p.channel, p.length].filter(Boolean).join(' · ')));
        if (safeUrl(p.url)) card.appendChild(link(p.url, 'Play', 'go'));
        else card.appendChild(el('p', 'muted', 'It plays on your Mac.'));
        break;
      case 'quiz': {
        card.appendChild(el('p', null, p.question));
        const why = el('p', 'muted');
        (p.choices || []).forEach((c, i) => {
          const b = el('button', 'choice', c);
          b.onclick = () => { b.classList.add(i === p.answer ? 'right' : 'wrong'); why.textContent = (i === p.answer ? 'Right. ' : 'Not quite. ') + (p.explain || ''); };
          card.appendChild(b);
        });
        card.appendChild(why); break;
      }
      case 'flashcards': {
        for (const c of p.cards || []) { const b = el('button', 'choice', c.front); let back = false; b.onclick = () => { back = !back; b.textContent = back ? c.back : c.front; }; card.appendChild(b); }
        break;
      }
      default: card.appendChild(el('p', 'muted', 'Open Keeper on your Mac to see this.'));
    }
    return card;
  }
  function show(r) {
    if (r.chat) chat = r.chat;
    const el = bubble('them', r.reply, r.learned && r.learned.length ? 'Remembered: ' + r.learned.join('; ') : r.mind);
    if (r.plan && r.plan.steps && r.plan.steps.length) planButtons(el, r.plan);
    for (const p of r.panelSpecs || []) if (p.kind !== 'approval') feed.appendChild(panelCard(p));
    feed.scrollTop = feed.scrollHeight;
    say(r.reply);
  }
  // One phone session is one chat on the keeper (its id comes back with each reply).
  let chat = '';
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const words = text.value.trim(); if (!words) return;
    text.value = ''; bubble('you', words); send.disabled = true; orb.classList.add('busy');
    try {
      show(await api('/api/turn', { text: words, chat }));
    } catch (e) { bubble('err', e.message); }
    finally { send.disabled = false; orb.classList.remove('busy'); text.focus(); }
  });
</script>
</body>
</html>
