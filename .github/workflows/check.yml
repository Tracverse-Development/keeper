# The checks on every push and pull request: typecheck, the TypeScript tests (structure guards
# included) and the Rust tests, on Linux: macOS is never built or checked on GitHub's runners
# (founder 2026-11-25: in-house); the Mac checks run on our own Macs. Release builds: release.yml.
name: check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # npm install, not npm ci: the lockfile (written on macOS) omits two optional packages that only
      # the bundler's WebAssembly build needs (@emnapi/core|runtime for @rolldown/binding-wasm32-wasi),
      # and npm ci refuses that gap; npm install keeps every locked version and fills it.
      - run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc -p . --noEmit

      - name: TypeScript tests
        run: find src -name '*.test.ts' -print0 | xargs -0 node --test --experimental-strip-types

      # generate_context! needs the built window. (The macOS-only voice sidecar is not bundled here.)
      - name: Window build
        run: npx vite build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
